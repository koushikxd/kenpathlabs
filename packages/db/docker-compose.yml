name: kenpathlabs

services:
  postgres:
    image: postgres:17
    container_name: kenpathlabs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kenpathlabs
    ports:
      - "5432:5432"
    volumes:
      - kenpathlabs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  kenpathlabs_postgres_data:
